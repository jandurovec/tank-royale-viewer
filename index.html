<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robocode Tank Royale Viewer</title>
  </head>
  <body>
    <div id="toast"></div>
    <div id="status-bar">
      <span id="status"></span>
      <span id="round-info"></span>
      <span id="turn-info"></span>
    </div>
    <button id="settings-btn" title="Settings">&#9881;</button>
    <div id="settings-panel">
      <label>
        Server URL
        <input type="text" id="server-url" value="ws://localhost:7654" />
      </label>
      <label>
        Secret (optional)
        <input type="password" id="server-secret" value="" placeholder="Leave blank if not required" />
      </label>
      <label class="slider">
        Scan arc opacity
        <input type="range" id="scan-opacity" min="0" max="100" value="5" />
        <span id="scan-opacity-value">5%</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" id="debug-log" />
        Enable debug logging
      </label>
      <div class="settings-divider"></div>
      <div class="settings-section">
        <span class="settings-section-title">Skill Ratings</span>
        <label class="checkbox">
          <input type="checkbox" id="show-ratings" checked />
          Show skill ratings
        </label>
        <label>
          Ranked games threshold
          <input type="number" id="ranked-games-threshold" min="1" max="100" value="20" />
        </label>
        <label>
          Provisional games threshold
          <input type="number" id="provisional-games-threshold" min="1" max="200" value="50" />
        </label>
        <div class="settings-button-row">
          <button id="export-ratings-btn" type="button">Export</button>
          <button id="import-ratings-btn" type="button">Import</button>
          <button id="reset-ratings-btn" type="button" class="danger">Reset</button>
        </div>
        <input type="file" id="import-ratings-file" accept=".json" style="display: none" />
      </div>
    </div>
    <div id="bot-list-container">
      <div id="waiting-message">Waiting for bots to connect...</div>
      <h2 id="bot-list-header">Connected Bots</h2>
      <table id="bot-list">
        <thead>
          <tr>
            <th>Bot</th>
            <th>Tier</th>
            <th>Rating</th>
            <th>Author</th>
            <th>Description</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="results-backdrop"></div>
    <div id="results-container">
      <h2>Battle Results</h2>
      <table id="results-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Bot</th>
            <th>Tier</th>
            <th>Rating</th>
            <th>Total</th>
            <th>Survival</th>
            <th>(bonus)</th>
            <th>Bullet Dmg</th>
            <th>(bonus)</th>
            <th>Ram Dmg</th>
            <th>(bonus)</th>
            <th>1sts</th>
            <th>2nds</th>
            <th>3rds</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="arena"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
